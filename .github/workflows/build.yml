name: Build Wing Theatre Controller

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-wingmon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing and build wingmon
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          cp wingmon/wingmon.rs libwing/tools/wingmon.rs
          python3 wingmon/patch_libwing.py
          cd libwing
          cargo build --release --example wingmon
          cp target/release/examples/wingmon ../wingmon-macos
          codesign --sign - --force ../wingmon-macos
      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-macos
          path: wingmon-macos

  build-wingmon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing and build wingmon
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          Copy-Item wingmon/wingmon.rs libwing/tools/wingmon.rs
          python3 wingmon/patch_libwing.py
          cd libwing
          cargo build --release --example wingmon
          Copy-Item target/release/examples/wingmon.exe ../wingmon.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-windows
          path: wingmon.exe

  build-app-macos:
    runs-on: macos-latest
    needs: build-wingmon-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-macos
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install PyQt6 python-osc pyinstaller

      - name: Build app
        run: |
          chmod +x wingmon-macos
          # Rename to the plain name _find_wingmon_path() actually looks
          # for on macOS ('wingmon', no suffix). The artifact/build name
          # 'wingmon-macos' only exists to distinguish it from the Windows
          # artifact during the earlier build-wingmon jobs -- bundling it
          # under that same name meant the app could never find it unless
          # a local dev copy happened to exist at ~/WingTheatre/wingmon as
          # a fallback (which is why this went unnoticed testing on the
          # dev machine, but failed for every other tester).
          cp wingmon-macos wingmon
          chmod +x wingmon
          # Write version file
          echo "${{ github.ref_name }} (build ${{ github.run_number }}, $(date +%Y-%m-%d))" > version.txt
          # Copy propmap from libwing
          git clone https://github.com/dannyfiresnake/libwing.git libwing_tmp
          cp libwing_tmp/src/propmap.jsonl propmap.jsonl || echo "propmap not found, skipping"
          # DIAGNOSTIC: print sample lines to the Actions log so the exact
          # current schema (field names) can be inspected without needing
          # to locate the file on a local machine. Safe to remove once the
          # propmap parsing bug is confirmed fixed.
          echo "=== propmap.jsonl sample (first 15 lines) ==="
          head -15 propmap.jsonl || echo "propmap.jsonl not present"
          echo "=== propmap.jsonl EQ-related sample (first 10 matches) ==="
          grep -m 10 '"/ch/1/eq/' propmap.jsonl || echo "no /ch/1/eq/ entries found"
          echo "=== end propmap.jsonl sample ==="
          # DIAGNOSTIC: full /ch/1/eq/ dump. User reports that even on the
          # STANDARD (STD) EQ model -- which DOES have propmap entries,
          # unlike other models -- only the TOP band recalls correctly.
          # This checks whether propmap.jsonl is simply missing entries for
          # bands 2+ even within STD, or whether all bands are present and
          # the bug is elsewhere.
          echo "=== propmap.jsonl FULL /ch/1/eq/ dump ==="
          grep '"fullname":"/ch/1/eq/' propmap.jsonl
          echo "=== end /ch/1/eq/ dump ==="
          echo "=== propmap.jsonl total entries with an index field ==="
          grep -c '"index"' propmap.jsonl || echo "0"
          echo "=== propmap.jsonl /ch/1/gate/ entries (all models?) ==="
          grep '"fullname":"/ch/1/gate/' propmap.jsonl | head -30
          echo "=== propmap.jsonl /ch/1/dyn/ entries (all models?) ==="
          grep '"fullname":"/ch/1/dyn/' propmap.jsonl | head -30
          echo "=== propmap.jsonl /ch/1/flt/ entries (all models?) ==="
          grep '"fullname":"/ch/1/flt/' propmap.jsonl | head -30
          echo "=== end propmap.jsonl model-coverage diagnostic ==="
          rm -rf libwing_tmp
          pyinstaller \
            --name "Wing Theatre Controller" \
            --windowed \
            --add-data "wingmon:." \
            --add-data "propmap.jsonl:." \
            --add-data "version.txt:." \
            --hidden-import PyQt6.sip \
            --hidden-import pythonosc \
            --osx-bundle-identifier dk.mikkelpeterlarsen.wingtheatre \
            wing_theatre.py
          # Info.plist: version shown in Finder, and the text macOS shows
          # when it asks for Local Network access (needed to reach the Wing).
          PLIST="dist/Wing Theatre Controller.app/Contents/Info.plist"
          VER="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VER" "$PLIST" || true
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$PLIST" || true
          plutil -replace NSLocalNetworkUsageDescription -string \
            "Wing Theatre Controller needs local network access to communicate with the Behringer Wing." "$PLIST"

      # ── Code signing ────────────────────────────────────────────────────
      # With the Apple Developer secrets set in GitHub (Settings -> Secrets
      # and variables -> Actions), the app is signed with the Developer ID
      # certificate and notarised by Apple, so it opens with a normal
      # double-click on any Mac. Without the secrets the build falls back
      # to the old ad-hoc signing, so a build never fails just because the
      # secrets are missing.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12:      ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret -- ad-hoc signing will be used."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" \
                     | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' certificate found in MACOS_CERT_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Sign app
        run: |
          APP="dist/Wing Theatre Controller.app"
          if [ -z "$SIGN_IDENTITY" ]; then
            # Fallback: ad-hoc (no Apple account). Needed on Apple Silicon
            # for the app to launch at all, but Gatekeeper still blocks
            # the first launch (right-click -> Open / Open Anyway).
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"
            exit 0
          fi
          SIGN=(codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY")
          # Sign inside-out: every Mach-O file first (dylibs, .so, Qt,
          # wingmon), then each .framework bundle (deepest first), then
          # the app itself with its entitlements. Symlinks are skipped
          # (find -type f). The main executable is re-signed last as part
          # of the app bundle.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              "${SIGN[@]}" "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          find "$APP/Contents" -type d -name "*.framework" \
            | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r fw; do "${SIGN[@]}" "$fw"; done
          "${SIGN[@]}" --entitlements entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags"

      - name: Notarise app
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "Not notarising (no Developer ID certificate or Apple ID secrets)."
            exit 0
          fi
          APP="dist/Wing Theatre Controller.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            SUB=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id',''))" "$RUNNER_TEMP/notary.json")
            [ -n "$SUB" ] && xcrun notarytool log "$SUB" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            echo "::error::Notarisation failed ($STATUS) -- see Apple's log above"
            exit 1
          fi
          # Staple the ticket into the app itself, so it also opens on a
          # Mac with no internet (typical for a theatre/FOH machine).
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Create DMG
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="WingTheatreController-macos.dmg"
          hdiutil create \
            -volname "Wing Theatre Controller" \
            -srcfolder "dist/Wing Theatre Controller.app" \
            -ov -format UDZO \
            "$DMG"
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
            if [ -n "$APPLE_ID" ]; then
              xcrun notarytool submit "$DMG" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                --wait --timeout 30m
              xcrun stapler staple "$DMG"
              xcrun stapler validate "$DMG"
            fi
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-macos
          path: WingTheatreController-macos.dmg

  build-app-windows:
    runs-on: windows-latest
    needs: build-wingmon-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-windows
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install PyQt6 python-osc pyinstaller

      - name: Build app
        run: |
          # Write version file
          "${{ github.ref_name }} (build ${{ github.run_number }}, $(Get-Date -Format 'yyyy-MM-dd'))" | Out-File -FilePath version.txt -Encoding utf8
          # Copy propmap from libwing
          git clone https://github.com/dannyfiresnake/libwing.git libwing_tmp
          Copy-Item libwing_tmp/src/propmap.jsonl propmap.jsonl -ErrorAction SilentlyContinue
          Remove-Item libwing_tmp -Recurse -Force
          pyinstaller `
            --name "Wing Theatre Controller" `
            --windowed `
            --add-data "wingmon.exe;." `
            --add-data "propmap.jsonl;." `
            --add-data "version.txt;." `
            --hidden-import PyQt6.sip `
            --hidden-import pythonosc `
            wing_theatre.py

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path "dist\Wing Theatre Controller" `
            -DestinationPath "WingTheatreController-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-windows
          path: WingTheatreController-windows.zip

  package-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install companion module deps
        run: |
          cd companion-module
          corepack yarn install --no-immutable

      - name: Package companion module
        run: zip -r companion-module-wingtheatre.zip companion-module/

      - uses: actions/upload-artifact@v4
        with:
          name: companion-module
          path: companion-module-wingtheatre.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-app-macos, build-app-windows, package-companion]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          name: Wing Theatre Controller ${{ github.ref_name }}
          body: |
            ## Wing Theatre Controller ${{ github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS | WingTheatreController-macos.dmg |
            | Windows | WingTheatreController-windows.zip |
            | Companion Module | companion-module-wingtheatre.zip |

            Built on libwing by dannyfiresnake. Protocol by Patrick-Gilles Maillot.
          files: |
            WingTheatreController-macos/*.dmg
            WingTheatreController-windows/*.zip
            companion-module/*.zip
