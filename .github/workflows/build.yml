name: Build Wing Theatre Controller

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # libwing is pinned to a tested commit, so an upstream change can never
  # change wingmon or propmap.jsonl in a release without us noticing.
  # (36d713e = libwing 1.0.6, 2026-10-30, incl. the set_int fix.)
  LIBWING_REF: 36d713e360ea8c37f210e4bb5f3a9a161b65ba17

jobs:

  build-wingmon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing and build wingmon
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          git -C libwing checkout -q $LIBWING_REF
          cp wingmon/wingmon.rs libwing/tools/wingmon.rs
          python3 wingmon/patch_libwing.py
          cd libwing
          cargo build --release --example wingmon
          cargo test --release --example wingmon   # wingmon's encoder tests
          cp target/release/examples/wingmon ../wingmon-macos
          codesign --sign - --force ../wingmon-macos
      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-macos
          path: wingmon-macos

  build-wingmon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing and build wingmon
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          git -C libwing checkout -q $env:LIBWING_REF
          Copy-Item wingmon/wingmon.rs libwing/tools/wingmon.rs
          python3 wingmon/patch_libwing.py
          cd libwing
          cargo build --release --example wingmon
          cargo test --release --example wingmon   # wingmon's encoder tests
          Copy-Item target/release/examples/wingmon.exe ../wingmon.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-windows
          path: wingmon.exe

  build-app-macos:
    runs-on: macos-latest
    needs: build-wingmon-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-macos
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # Upper bounds: a new MAJOR release of Qt/PyInstaller can't sneak
        # into a build unnoticed (minor/patch updates still come in).
        run: pip install "PyQt6>=6.6,<7" "python-osc>=1.8,<2" "pyinstaller>=6.6,<7"

      - name: Build app
        run: |
          chmod +x wingmon-macos
          # Rename to the plain name _find_wingmon_path() actually looks
          # for on macOS ('wingmon', no suffix). The artifact/build name
          # 'wingmon-macos' only exists to distinguish it from the Windows
          # artifact during the earlier build-wingmon jobs -- bundling it
          # under that same name meant the app could never find it unless
          # a local dev copy happened to exist at ~/WingTheatre/wingmon as
          # a fallback (which is why this went unnoticed testing on the
          # dev machine, but failed for every other tester).
          cp wingmon-macos wingmon
          chmod +x wingmon
          # Write version file
          echo "${{ github.ref_name }} (build ${{ github.run_number }}, $(date +%Y-%m-%d))" > version.txt
          # Copy propmap from libwing
          git clone https://github.com/dannyfiresnake/libwing.git libwing_tmp
          git -C libwing_tmp checkout -q $LIBWING_REF
          cp libwing_tmp/src/propmap.jsonl propmap.jsonl || echo "propmap not found, skipping"
          echo "propmap.jsonl: $(wc -l < propmap.jsonl) entries"
          rm -rf libwing_tmp
          pyinstaller \
            --noconfirm \
            --name "Wing Theatre Controller" \
            --windowed \
            --add-data "wingmon:." \
            --add-data "propmap.jsonl:." \
            --add-data "version.txt:." \
            --hidden-import PyQt6.sip \
            --hidden-import pythonosc \
            --osx-bundle-identifier dk.mikkelpeterlarsen.wingtheatre \
            wing_theatre.py
          # Info.plist: version shown in Finder, and the text macOS shows
          # when it asks for Local Network access (needed to reach the Wing).
          PLIST="dist/Wing Theatre Controller.app/Contents/Info.plist"
          VER="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VER" "$PLIST" || true
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$PLIST" || true
          plutil -replace NSLocalNetworkUsageDescription -string \
            "Wing Theatre Controller needs local network access to communicate with the Behringer Wing." "$PLIST"
          # Double-clicking a .wts show file in Finder opens it in the app
          plutil -replace CFBundleDocumentTypes -xml \
            '<array><dict><key>CFBundleTypeName</key><string>Wing Theatre Show</string><key>CFBundleTypeRole</key><string>Editor</string><key>LSHandlerRank</key><string>Owner</string><key>CFBundleTypeExtensions</key><array><string>wts</string></array></dict></array>' \
            "$PLIST"

      # ── Code signing ────────────────────────────────────────────────────
      # With the Apple Developer secrets set in GitHub (Settings -> Secrets
      # and variables -> Actions), the app is signed with the Developer ID
      # certificate and notarised by Apple, so it opens with a normal
      # double-click on any Mac. Without the secrets the build falls back
      # to the old ad-hoc signing, so a build never fails just because the
      # secrets are missing.
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12:      ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret -- ad-hoc signing will be used."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" \
                     | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' certificate found in MACOS_CERT_P12"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Sign app
        run: |
          APP="dist/Wing Theatre Controller.app"
          if [ -z "$SIGN_IDENTITY" ]; then
            # Fallback: ad-hoc (no Apple account). Needed on Apple Silicon
            # for the app to launch at all, but Gatekeeper still blocks
            # the first launch (right-click -> Open / Open Anyway).
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"
            exit 0
          fi
          SIGN=(codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY")
          # Sign inside-out: every Mach-O file first (dylibs, .so, Qt,
          # wingmon), then each .framework bundle (deepest first), then
          # the app itself with its entitlements. Symlinks are skipped
          # (find -type f). The main executable is re-signed last as part
          # of the app bundle.
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              "${SIGN[@]}" "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          find "$APP/Contents" -type d -name "*.framework" \
            | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- \
            | while IFS= read -r fw; do "${SIGN[@]}" "$fw"; done
          "${SIGN[@]}" --entitlements entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags"

      - name: Self-test (built app)
        timeout-minutes: 5
        run: |
          export QT_QPA_PLATFORM=offscreen
          "dist/Wing Theatre Controller.app/Contents/MacOS/Wing Theatre Controller" --selftest "$RUNNER_TEMP/app-selftest" \
            || { cat "$RUNNER_TEMP/app-selftest/selftest.txt" 2>/dev/null; echo "::error::Self-test of the built app failed"; exit 1; }
          tail -1 "$RUNNER_TEMP/app-selftest/selftest.txt"
          # The self-test must not have written anything into the signed bundle
          codesign --verify --deep --strict "dist/Wing Theatre Controller.app"

      - name: Notarise app
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "Not notarising (no Developer ID certificate or Apple ID secrets)."
            exit 0
          fi
          APP="dist/Wing Theatre Controller.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$RUNNER_TEMP/notary.json")
          if [ "$STATUS" != "Accepted" ]; then
            SUB=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id',''))" "$RUNNER_TEMP/notary.json")
            [ -n "$SUB" ] && xcrun notarytool log "$SUB" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            echo "::error::Notarisation failed ($STATUS) -- see Apple's log above"
            exit 1
          fi
          # Staple the ticket into the app itself, so it also opens on a
          # Mac with no internet (typical for a theatre/FOH machine).
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Create DMG
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="WingTheatreController-macos.dmg"
          hdiutil create \
            -volname "Wing Theatre Controller" \
            -srcfolder "dist/Wing Theatre Controller.app" \
            -ov -format UDZO \
            "$DMG"
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
            if [ -n "$APPLE_ID" ]; then
              xcrun notarytool submit "$DMG" \
                --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
                --wait --timeout 30m
              xcrun stapler staple "$DMG"
              xcrun stapler validate "$DMG"
            fi
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-macos
          path: WingTheatreController-macos.dmg

  build-app-windows:
    runs-on: windows-latest
    needs: build-wingmon-windows
    env:
      # Windows signing only runs when the Azure secrets exist -- without
      # them the build still succeeds, just unsigned (as before).
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-windows
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # Upper bounds: a new MAJOR release of Qt/PyInstaller can't sneak
        # into a build unnoticed (minor/patch updates still come in).
        run: pip install "PyQt6>=6.6,<7" "python-osc>=1.8,<2" "pyinstaller>=6.6,<7"

      - name: Build app
        run: |
          # Write version file
          "${{ github.ref_name }} (build ${{ github.run_number }}, $(Get-Date -Format 'yyyy-MM-dd'))" | Out-File -FilePath version.txt -Encoding utf8
          # Copy propmap from libwing
          git clone https://github.com/dannyfiresnake/libwing.git libwing_tmp
          git -C libwing_tmp checkout -q $env:LIBWING_REF
          Copy-Item libwing_tmp/src/propmap.jsonl propmap.jsonl -ErrorAction SilentlyContinue
          Remove-Item libwing_tmp -Recurse -Force
          pyinstaller `
            --noconfirm `
            --name "Wing Theatre Controller" `
            --windowed `
            --add-data "wingmon.exe;." `
            --add-data "propmap.jsonl;." `
            --add-data "version.txt;." `
            --hidden-import PyQt6.sip `
            --hidden-import pythonosc `
            wing_theatre.py

      # ── Code signing (Azure Artifact Signing, formerly Trusted Signing) ──
      # Signs every .exe, .dll and .pyd in the build -- the app, the bundled
      # wingmon.exe and every Python/Qt library -- with a timestamp, so the
      # signature stays valid after the short-lived Azure certificate
      # expires. Windows then shows the publisher name instead of "Unknown
      # publisher", and Windows 11 Smart App Control (which checks every
      # library the app loads, not just the .exe) lets it start.
      - name: Sign app (Azure Artifact Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id:          ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:          ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:      ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                 ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder:             ${{ github.workspace }}\dist\Wing Theatre Controller
          files-folder-filter:      exe,dll,pyd
          files-folder-recurse:     true
          file-digest:              SHA256
          timestamp-rfc3161:        http://timestamp.acs.microsoft.com
          timestamp-digest:         SHA256
          description:              Wing Theatre Controller
          description-url:          https://github.com/mikk3722/wing-theatre-controller

      - name: Verify signatures
        if: env.HAS_AZURE_SIGNING == 'true'
        run: |
          $bad = 0
          $files = Get-ChildItem "dist\Wing Theatre Controller" -Recurse -File |
                   Where-Object { $_.Extension -in '.exe', '.dll', '.pyd' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($f.Extension -eq '.exe') {
              Write-Host ("{0,-12} {1}  [{2}]" -f $sig.Status, $f.Name, $sig.SignerCertificate.Subject)
            }
            if ($sig.Status -ne 'Valid') { Write-Host "NOT SIGNED: $($f.FullName) ($($sig.Status))"; $bad++ }
          }
          Write-Host "$($files.Count) exe/dll/pyd files checked, $bad not validly signed"
          if ($bad -gt 0) { Write-Error "$bad file(s) not validly signed"; exit 1 }

      # Start the BUILT app headless and run its self-test (see
      # run_selftest in wing_theatre.py): catches a broken build -- missing
      # library, missing wingmon/propmap, a crash at startup or in recall,
      # fades, save/load or the Companion server -- before it is released.
      - name: Self-test (built app)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\Wing Theatre Controller\Wing Theatre Controller.exe" `
                 -ArgumentList "--selftest","exe-selftest" -Wait -PassThru
          if (Test-Path exe-selftest\selftest.txt) { Get-Content exe-selftest\selftest.txt }
          if ($p.ExitCode -ne 0) { throw "Self-test of the built app failed (exit $($p.ExitCode))" }

      - name: Create ZIP (portable)
        run: |
          Compress-Archive `
            -Path "dist\Wing Theatre Controller" `
            -DestinationPath "WingTheatreController-windows-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe", "C:\Program Files\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) was not found" }
          $ver = "0.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v?(\d+(\.\d+){0,3})$') { $ver = $Matches[1] }
          Write-Host "Installer version: $ver"
          & $iscc.FullName "/DMyAppVersion=$ver" "installer\wing-theatre-controller.iss"
          if ($LASTEXITCODE -ne 0) { throw "The installer could not be built" }
          Get-ChildItem installer-out

      - name: Sign installer (Azure Artifact Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id:          ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:          ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:      ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                 ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name:     ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder:             ${{ github.workspace }}\installer-out
          files-folder-filter:      exe
          file-digest:              SHA256
          timestamp-rfc3161:        http://timestamp.acs.microsoft.com
          timestamp-digest:         SHA256
          description:              Wing Theatre Controller Setup
          description-url:          https://github.com/mikk3722/wing-theatre-controller

      # Install for the current user (no admin), check the Start menu entry
      # and the .wts association, run the self-test on the INSTALLED app,
      # then uninstall and check nothing is left behind.
      - name: Test the installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = "installer-out\WingTheatreController-Setup.exe"
          $sig = Get-AuthenticodeSignature $setup
          if ($env:HAS_AZURE_SIGNING -eq "true" -and $sig.Status -ne "Valid") { throw "The installer is not signed correctly: $($sig.Status)" }
          if ($sig.Status -eq "Valid") { Write-Output "::notice::Installer signed by $($sig.SignerCertificate.Subject)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\WTC-installer-test"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $exe = Join-Path $dir "Wing Theatre Controller.exe"
          if (-not (Test-Path $exe)) { throw "Wing Theatre Controller.exe was not installed" }
          $assoc = (Get-ItemProperty "HKCU:\Software\Classes\WingTheatreController.Show\shell\open\command").'(default)'
          Write-Output "Open command: $assoc"
          if ($assoc -notlike "*Wing Theatre Controller.exe*") { throw ".wts is not associated with the app" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Wing Theatre Controller.lnk" -Recurse
          if (-not $lnk) { throw "No Start menu shortcut" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $exe -ArgumentList "--selftest","installed-selftest" -Wait -PassThru
          if (Test-Path installed-selftest\selftest.txt) { Get-Content installed-selftest\selftest.txt | Select-Object -Last 1 }
          if ($t.ExitCode -ne 0) { throw "The installed app failed its self-test" }
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "Uninstall left the app behind" }
          if (Test-Path "HKCU:\Software\Classes\WingTheatreController.Show") { throw "Uninstall left the file association behind" }
          Write-Output "::notice::Installer: install, Start menu, .wts association, self-test and uninstall all OK"

      # The installer is delivered inside a zip (some mail/web filters block
      # a bare .exe download); the portable version is a zip as before.
      - name: Zip installer
        run: |
          Compress-Archive `
            -Path "installer-out\WingTheatreController-Setup.exe" `
            -DestinationPath "WingTheatreController-windows-installer.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: |
            exe-selftest
            installed-selftest
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-windows
          path: |
            WingTheatreController-windows-installer.zip
            WingTheatreController-windows-portable.zip

  package-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install companion module deps
        run: |
          cd companion-module
          corepack yarn install --no-immutable

      - name: Package companion module
        run: zip -r companion-module-wingtheatre.zip companion-module/

      - uses: actions/upload-artifact@v4
        with:
          name: companion-module
          path: companion-module-wingtheatre.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-app-macos, build-app-windows, package-companion]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          name: Wing Theatre Controller ${{ github.ref_name }}
          body: |
            ## Wing Theatre Controller ${{ github.ref_name }}

            | Platform | Download |
            |---|---|
            | macOS | WingTheatreController-macos.dmg |
            | Windows (installer) | WingTheatreController-windows-installer.zip -- unzip and run WingTheatreController-Setup.exe (Start menu, uninstaller, double-click .wts to open) |
            | Windows (portable) | WingTheatreController-windows-portable.zip -- unzip anywhere and run Wing Theatre Controller.exe, no installation |
            | Companion Module | companion-module-wingtheatre.zip |

            Built on libwing by dannyfiresnake. Protocol by Patrick-Gilles Maillot.
          files: |
            WingTheatreController-macos/*.dmg
            WingTheatreController-windows/*.zip
            companion-module/*.zip
