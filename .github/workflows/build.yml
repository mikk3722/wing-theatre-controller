name: Build Wing Theatre Controller

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── Build wingmon (Rust) ───────────────────────────────────────────────────
  build-wingmon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          cp wingmon/wingmon.rs libwing/tools/wingmon.rs

      - name: Build wingmon (macOS)
        run: |
          cd libwing
          cargo build --release --example wingmon
          cp target/release/examples/wingmon ../wingmon-macos
          codesign --sign - --force ../wingmon-macos

      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-macos
          path: wingmon-macos

  build-wingmon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone libwing
        run: |
          git clone https://github.com/dannyfiresnake/libwing.git
          Copy-Item wingmon/wingmon.rs libwing/tools/wingmon.rs

      - name: Build wingmon (Windows)
        run: |
          cd libwing
          cargo build --release --example wingmon
          Copy-Item target/release/examples/wingmon.exe ../wingmon.exe

      - uses: actions/upload-artifact@v4
        with:
          name: wingmon-windows
          path: wingmon.exe

  # ── Build Wing Theatre (PyInstaller) ──────────────────────────────────────
  build-app-macos:
    runs-on: macos-latest
    needs: build-wingmon-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-macos
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt6 python-osc pyinstaller

      - name: Build app (macOS)
        run: |
          chmod +x wingmon-macos
          pyinstaller \
            --name "Wing Theatre Controller" \
            --windowed \
            --add-data "wingmon-macos:." \
            --hidden-import PyQt6.sip \
            --hidden-import pythonosc \
            wing_theatre.py

      - name: Package DMG
        run: |
          hdiutil create -volname "Wing Theatre Controller" \
            -srcfolder "dist/Wing Theatre Controller.app" \
            -ov -format UDZO \
            "WingTheatreController-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-macos
          path: WingTheatreController-macos.dmg

  build-app-windows:
    runs-on: windows-latest
    needs: build-wingmon-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wingmon-windows
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyQt6 python-osc pyinstaller

      - name: Build app (Windows)
        run: |
          pyinstaller `
            --name "Wing Theatre Controller" `
            --windowed `
            --add-data "wingmon.exe;." `
            --hidden-import PyQt6.sip `
            --hidden-import pythonosc `
            wing_theatre.py

      - name: Package ZIP
        run: |
          Compress-Archive -Path "dist\Wing Theatre Controller" `
            -DestinationPath "WingTheatreController-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WingTheatreController-windows
          path: WingTheatreController-windows.zip

  # ── Package Companion Module ───────────────────────────────────────────────
  package-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + yarn 4
     run: |
       corepack enable
       corepack prepare yarn@4.10.3 --activate

      - name: Install companion module deps
        run: |
          cd companion-module
          yarn install

      - name: Package companion module
        run: |
          zip -r companion-module-wingtheatre.zip companion-module/

      - uses: actions/upload-artifact@v4
        with:
          name: companion-module
          path: companion-module-wingtheatre.zip

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-app-macos, build-app-windows, package-companion]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wing Theatre Controller ${{ github.ref_name }}
          body: |
            ## Wing Theatre Controller ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |---|---|
            | macOS | WingTheatreController-macos.dmg |
            | Windows | WingTheatreController-windows.zip |
            | Companion Module | companion-module-wingtheatre.zip |

            ### Companion Module Installation
            1. Extract `companion-module-wingtheatre.zip`
            2. Run `install-windows.bat` (Windows) or use Companion's bundled yarn (macOS)
            3. Set developer folder in Companion Launcher

            ### Credits
            - wingmon built on [libwing](https://github.com/dannyfiresnake/libwing) by dannyfiresnake
            - Protocol documentation by Patrick-Gilles Maillot
          files: |
            WingTheatreController-macos/*.dmg
            WingTheatreController-windows/*.zip
            companion-module/*.zip
